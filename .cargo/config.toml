[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-a14"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,-z,nodelete"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=cortex-a57", "-C", "link-args=-Wl,-z,nodelete"]

[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "target-cpu=cortex-a7", "-C", "link-args=-Wl,-z,nodelete"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=cortex-a57"]

# Match the Skia Westmere baseline. Default rustc x86-64 is SSE2-only, but a
# native or v3 CPU on the build machine must not leak into this cdylib.
# AVX2/AVX-512 helpers in src/unpremul.rs stay behind is_x86_feature_detected.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=westmere"]
